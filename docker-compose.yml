services:
  radioforge:
    build: .
    restart: unless-stopped
    environment:
      # Opcional: domínio ou IP público usado nas URLs de stream. Vazio = usa o endereço pelo qual o painel foi aberto.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    ports:
      - "3000:3000"            # painel + API
      - "8000-8499:8000-8499"  # Icecast/DJ/telnet das estações (10 portas por estação)
      - "2222:2222"  # SFTP da biblioteca de cada estação
    volumes:
      - radioforge-data:/data

volumes:
  radioforge-data:
