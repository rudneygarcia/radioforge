services:
  radioforge:
    build: .
    restart: unless-stopped
    environment:
      # Domínio ou IP público do servidor (usado nas URLs de stream mostradas no painel).
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "3000:3000"            # painel + API
      - "8000-8499:8000-8499"  # Icecast/DJ/telnet das estações (10 portas por estação)
    volumes:
      - radioforge-data:/data

volumes:
  radioforge-data:
